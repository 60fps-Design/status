<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60fps Status</title>
<meta name="description" content="Status and uptime history for 60fps.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%E2%97%8F</text></svg>">
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --border: #e6e6e9; --text: #16161a;
    --muted: #6c6c76; --up: #16a34a; --down: #dc2626; --none: #dcdce1;
    --shadow: 0 1px 2px rgba(16,16,26,.05), 0 1px 8px rgba(16,16,26,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0e; --panel: #131317; --border: #26262d; --text: #f2f2f4;
      --muted: #9b9ba6; --up: #34d399; --down: #f87171; --none: #2a2a32;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 20px 72px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 a { color: inherit; text-decoration: none; }
  .updated { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .banner {
    margin: 22px 0 30px; padding: 18px 20px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 13px;
  }
  .banner strong { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .dot.up { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 18%, transparent); }
  .dot.down { background: var(--down); box-shadow: 0 0 0 3px color-mix(in srgb, var(--down) 18%, transparent); }

  .card {
    border: 1px solid var(--border); background: var(--panel); border-radius: 12px;
    padding: 18px 20px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .name { font-weight: 600; letter-spacing: -.01em; }
  .state { font-size: 13px; font-weight: 500; }
  .state.up { color: var(--up); } .state.down { color: var(--down); }
  .blurb { color: var(--muted); font-size: 13px; margin: 3px 0 14px; }

  /* 90 day strip. Scrolls inside itself on small screens so the page never scrolls sideways. */
  .stripwrap { overflow-x: auto; padding-bottom: 2px; }
  .strip { display: flex; gap: 2px; min-width: 270px; }
  .bar { flex: 1 1 0; min-width: 2px; height: 30px; border-radius: 2px; background: var(--none); }
  .bar.ok { background: var(--up); }
  .bar.bad { background: var(--down); }
  .bar.part { background: linear-gradient(to bottom, var(--up) 55%, var(--down) 55%); }

  .legend {
    display: flex; justify-content: space-between; color: var(--muted);
    font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums;
  }
  .metrics { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .metric { font-size: 12px; color: var(--muted); }
  .metric b { display: block; font-size: 15px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  footer { margin-top: 34px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  .err { color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="https://60fps.design">60fps</a> Status</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div class="banner" id="banner">
    <span class="dot" id="banner-dot"></span>
    <strong id="banner-text">Loading…</strong>
  </div>

  <div id="checks"></div>

  <footer id="foot">
    Checked every 5 minutes, independently of the services above.
  </footer>
</div>

<script>
// Renders data/summary.json and computes nothing of its own, so the page cannot drift
// from what was measured.
const pct = (v) => v === null || v === undefined ? "–" : (v >= 99.995 ? "100" : v.toFixed(2)) + "%";

function barClass(p) {
  if (p === null) return "";
  if (p >= 99.995) return "ok";
  if (p >= 50) return "part";
  return "bad";
}

fetch("data/summary.json?" + Date.now())
  .then((r) => { if (!r.ok) throw new Error("no data yet"); return r.json(); })
  .then((s) => {
    const allUp = s.allUp;
    document.getElementById("banner-dot").className = "dot " + (allUp ? "up" : "down");
    document.getElementById("banner-text").textContent =
      allUp ? "All systems operational" : "Some systems are down";
    document.getElementById("updated").textContent =
      "Updated " + new Date(s.generated).toLocaleString();

    // A dash means we were not monitoring for that whole window yet, not that uptime was poor.
    if (s.checks.some((c) => [c.uptime24h, c.uptime7d, c.uptime90d].includes(null))) {
      const d = new Date(s.since).toLocaleDateString(undefined, {
        day: "numeric", month: "long", year: "numeric",
      });
      document.getElementById("foot").insertAdjacentHTML(
        "beforeend",
        ` Monitoring began ${d}, so longer windows show a dash until there is data.`
      );
    }

    document.getElementById("checks").innerHTML = s.checks.map((c) => `
      <div class="card">
        <div class="row">
          <span class="name">${c.name}</span>
          <span class="state ${c.up ? "up" : "down"}">${c.up ? "Operational" : "Down"}</span>
        </div>
        <div class="blurb">${c.blurb}</div>
        <div class="stripwrap"><div class="strip">
          ${c.days.map((d) => `<div class="bar ${barClass(d.pct)}" title="${d.d}: ${pct(d.pct)}"></div>`).join("")}
        </div></div>
        <div class="legend"><span>90 days ago</span><span>today</span></div>
        <div class="metrics">
          <div class="metric"><b>${pct(c.uptime24h)}</b>24 hours</div>
          <div class="metric"><b>${pct(c.uptime7d)}</b>7 days</div>
          <div class="metric"><b>${pct(c.uptime90d)}</b>90 days</div>
          <div class="metric"><b>${c.ms} ms</b>last response</div>
        </div>
      </div>`).join("");
  })
  .catch(() => {
    document.getElementById("banner-dot").className = "dot down";
    document.getElementById("banner-text").textContent = "Status data unavailable";
    document.getElementById("checks").innerHTML =
      '<div class="card err">The first check has not run yet, or the data file failed to load.</div>';
  });
</script>
</body>
</html>
