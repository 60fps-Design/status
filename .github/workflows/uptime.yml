name: Uptime check

# Probes the endpoints in config.json and commits the result back, which Pages serves.

on:
  schedule:
    # GitHub's minimum, but it throttles cron on shared runners. Observed median spacing ~65min,
    # worst 212min. Treat this as "at least hourly", which is what the page claims.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# One commit at a time. Never cancel: a cancelled run loses a sample.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Probe endpoints
        run: node scripts/check.mjs

      - name: Commit results
        run: |
          git config user.name "60fps Status bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "status: $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # Runs can overlap; rebase rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
